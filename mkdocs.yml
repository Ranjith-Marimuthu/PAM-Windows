site_name: PAM 2.0 Windows Breakglass TechDocs
site_description: Technical and end-user documentation for PAM 2.0 Windows breakglass password management

docs_dir: docs

nav:
  - Home: index.md
  - Glossary: glossary.md
  - End Users:
      - Overview: for-end-users/index.md
      - User Handbook: for-end-users/user-handbook.md
      - Access Workflows: for-end-users/access-workflows.md
      - FAQ: for-end-users/faq.md
      - Getting Help: for-end-users/getting-help.md
  - Administrators:
      - Overview: for-administrators/index.md
      - Architecture: for-administrators/PAM-Architecture.md
      - Logical Flow: for-administrators/PAM-Windows-Logical-Flow.md
      - Active Directory and GPO: for-administrators/PAM-Windows-GPO-Requirements.md
      - Network Topology: for-administrators/PAM-Network-Topology.md
      - Discovery and Onboarding: for-administrators/PAM-Windows-Discovery-onboarding.md
      - Password Management: for-administrators/PAM-Windows-Password-management.md
      - Operational Runbooks: for-administrators/PAM-Windows-Operational-runbooks.md
      - Troubleshooting: for-administrators/troubleshooting.md
  - Reference:
      - Configuration Matrix: reference/configuration-matrix.md
      - RACI: reference/raci.md

plugins:
  - techdocs-core

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_core
